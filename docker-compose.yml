# Sobe o EcoEletro ES em http://IP-DA-VPS:8090
# Variáveis obrigatórias (defina no painel da Hostinger ou num arquivo .env ao lado deste):
#   JWT_SECRET   valor aleatório longo
#   ADMIN_SENHA  senha do usuário admin
services:
  ecoeletro:
    build: .
    restart: unless-stopped
    ports:
      - '${PORTA:-8090}:3000'
    environment:
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ecoeletro.local}
      ADMIN_SENHA: ${ADMIN_SENHA:?Defina ADMIN_SENHA}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-EcoEletroES/1.0 (projeto academico PEI II)}
    volumes:
      - dados:/data

volumes:
  dados:
